# Single-broker KRaft Kafka, the fraudstream service, Prometheus and Grafana.
#   cp .env.example .env   # then put real token hashes in it
#   docker compose up --build
services:
  kafka:
    image: apache/kafka-native:3.9.1
    container_name: fraudstream-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "127.0.0.1:9094:9094"

  fraudstream:
    build: .
    image: fraudstream:local
    container_name: fraudstream-app
    depends_on:
      - kafka
    environment:
      FRAUDSTREAM_BOOTSTRAP_SERVERS: kafka:9092
      FRAUDSTREAM_ADVERTISED_HOST: fraudstream
      FRAUDSTREAM_AUTH_TOKENS: ${FRAUDSTREAM_AUTH_TOKENS:?copy .env.example to .env}
      FRAUDSTREAM_SEED_RULES: "true"
      FRAUDSTREAM_PARTITIONS: "3"
    ports:
      - "127.0.0.1:${FRAUDSTREAM_API_PORT:-8080}:8080"
      - "127.0.0.1:${FRAUDSTREAM_MANAGEMENT_PORT:-8081}:8081"
    volumes:
      - fraudstream-state:/app/state
    mem_limit: 768m
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: fraudstream-prometheus
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:12.1.0
    container_name: fraudstream-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-replace-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    profiles: ["observability"]

volumes:
  fraudstream-state:
